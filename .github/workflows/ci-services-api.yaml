name: ci-services-api

on:
    push:
        branches: [main]
        paths:
            - "services/api/**"
    pull_request:
        branches: [main]
        paths:
            - "services/api/**"

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint:api

            - name: Run Tests
              run: npm run test:api

            - name: Build TypeScript
              run: npm run build:api
